<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>Word Garden · 390×844 frame</title>
<style>
  html,body{margin:0;padding:0;background:#e7edf4}
  iframe{width:390px;height:844px;border:0;display:block;background:#fff}
</style>
</head>
<body>
<iframe id="f"></iframe>
<script>
  window.__errs = [];
  var f = document.getElementById('f');
  f.src = './index.html?b=' + Date.now();   /* always the freshest build */
  function push(s){ window.__errs.push(String(s)); }
  f.addEventListener('load', function(){
    try {
      var w = f.contentWindow;
      w.addEventListener('error', function(e){ push((e.message || 'error') + ' @' + (e.lineno || 0) + ':' + (e.colno || 0)); });
      w.addEventListener('unhandledrejection', function(e){ push('rejection: ' + ((e.reason && e.reason.message) || e.reason)); });
      var ce = w.console.error;
      w.console.error = function(){ push('console.error: ' + Array.prototype.join.call(arguments, ' ')); if (ce) ce.apply(w.console, arguments); };
    } catch (err) { push('harness: ' + err.message); }
  });
  window.__wgdoc = function(){ return f.contentWindow.document; };
  window.__wgwin = function(){ return f.contentWindow; };
</script>
</body>
</html>
