<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>390 확인</title>
<style>
  html, body { margin: 0; background: #eef2f6; }
  iframe { width: 390px; height: 844px; border: 0; display: block; background: #fff; }
</style>
</head>
<body>
<iframe id="app" src="index.html"></iframe>
<script>
  var errs = [];
  var f = document.getElementById('app');
  f.addEventListener('load', function () {
    try {
      f.contentWindow.addEventListener('error', function (e) {
        errs.push('error: ' + (e.message || e.type));
      });
      f.contentWindow.addEventListener('unhandledrejection', function (e) {
        errs.push('rejection: ' + (e.reason && e.reason.message ? e.reason.message : e.reason));
      });
    } catch (e) { errs.push('hook failed: ' + e.message); }
  });
  window.__report = function () {
    var w = f.contentWindow;
    return {
      innerWidth: w.innerWidth,
      innerHeight: w.innerHeight,
      errors: errs,
      tag: w.document.querySelector('#homeTag').textContent,
      overflow: w.document.documentElement.scrollWidth - w.innerWidth
    };
  };
</script>
</body>
</html>
